; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 38400

[env:atmega328p_test] # only initializes variables, does not read sensors; runs for 10 iterations
build_flags = 
    -DTEST_RUN=1
    -DUSE_DS=0
    -DUSE_DHT=0
    -DUSE_BMP=0
    -DUSE_GPS=0
    -DUSE_SD=0
    -DUSE_RADIO=0

[env:atmega328p_dht] # tests the DHT22 sensor -- reads temperature (internal) and humidity
build_flags = 
    -DUSE_DS=0
    -DUSE_DHT=1
    -DUSE_BMP=0
    -DUSE_GPS=0
    -DUSE_SD=0
    -DUSE_RADIO=0

[env:atmega328p_sensors] # reads temperature (internal), pressure and humidity
build_flags = 
    -DUSE_DS=0
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=0
    -DUSE_SD=0
    -DUSE_RADIO=0

[env:atmega328p_sensors_ext] # reads temperature (internal + external), pressure and humidity
build_flags = 
    -DUSE_DS=1
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=0
    -DUSE_SD=0
    -DUSE_RADIO=0

[env:atmega328p_sensors_all] # reads all sensors: temperature (internal + external), pressure, humidity and GPS position
build_flags = 
    -DUSE_DS=1
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=1
    -DUSE_SD=0
    -DUSE_RADIO=0

[env:atmega328p_radio] # reads all sensors + transmits via radio
build_flags = 
    -DUSE_DS=1
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=1
    -DUSE_SD=0
    -DUSE_RADIO=1

[env:atmega328p_sd] # reads all sensors + saves to SD card
build_flags = 
    -DUSE_DS=1
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=1
    -DUSE_SD=1
    -DUSE_RADIO=0

[env:atmega328p_full] # full version: reads all sensors + transmits via radio + saves to SD card
build_flags = 
    -DUSE_DS=1
    -DUSE_DHT=1
    -DUSE_BMP=1
    -DUSE_GPS=1
    -DUSE_SD=1
    -DUSE_RADIO=1