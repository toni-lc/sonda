; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 38400
lib_ldf_mode = deep+
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit BMP085 Library@^1.2.4

[env:atmega328p_test]
build_flags = 
	-DTEST_RUN=1
	-DUSE_DS=0
	-DUSE_DHT=0
	-DUSE_BMP=0
	-DUSE_GPS=0
	-DUSE_SD=0
	-DUSE_RADIO=0


[env:atmega328p_dht]
build_flags = 
	-DUSE_DS=0
	-DUSE_DHT=1
	-DUSE_BMP=0
	-DUSE_GPS=0
	-DUSE_SD=0
	-DUSE_RADIO=0

[env:atmega328p_sensors]
build_flags = 
	-DUSE_DS=0
	-DUSE_DHT=1
	-DUSE_BMP=1
	-DUSE_GPS=0
	-DUSE_SD=0
	-DUSE_RADIO=0

[env:atmega328p_sensors_ext]
build_flags = 
	-DUSE_DS=1
	-DUSE_DHT=0
	-DUSE_BMP=0
	-DUSE_GPS=0
	-DUSE_SD=0
	-DUSE_RADIO=0

[env:atmega328p_sensors_gps]
build_flags = 
	-DUSE_DS=0
	-DUSE_DHT=0
	-DUSE_BMP=0
	-DUSE_GPS=1
	-DUSE_SD=0
	-DUSE_RADIO=0

[env:atmega328p_sensors_all]
build_flags = 
	-DUSE_DS=1
	-DUSE_DHT=1
	-DUSE_BMP=1
	-DUSE_GPS=1
	-DUSE_SD=0
	-DUSE_RADIO=0

[env:atmega328p_radio]
build_flags = 
	-DUSE_DS=1
	-DUSE_DHT=1
	-DUSE_BMP=1
	-DUSE_GPS=1
	-DUSE_SD=0
	-DUSE_RADIO=1

[env:atmega328p_sd]
build_flags = 
	-DUSE_DS=1
	-DUSE_DHT=1
	-DUSE_BMP=1
	-DUSE_GPS=1
	-DUSE_SD=1
	-DUSE_RADIO=0

[env:atmega328p_full]
build_flags = 
	-DUSE_DS=1
	-DUSE_DHT=1
	-DUSE_BMP=1
	-DUSE_GPS=1
	-DUSE_SD=1
	-DUSE_RADIO=1
